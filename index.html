<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo di Rilevamento Temperatura</title>
</head>
<body>
    <h1>Modulo di Rilevamento Temperatura</h1>
    <form action="es1_A.php" method="get">
        <label for="localita">Localita':</label>
        <input type="text" id="localita" name="localita" required><br><br>

        <label for="data">Data:</label>
        <input type="date" id="data" name="data" required><br><br>

        <label for="ora">Ora:</label>
        <input type="time" id="ora" name="ora" required><br><br>

        <label>Tipo rilevazione:</label>
        <input type="radio" name="tipo" value="OFC"> OFC
        <input type="radio" name="tipo" value="AMB"> AMB
        <input type="radio" name="tipo" value="DRA"> DRA
        <br><br>

        <label for="umidita">Umidita':</label>
        <select id="umidita" name="umidita" required>
            <option value="assoluta">Assoluta</option>
            <option value="relativa">Relativa</option>
        </select><br><br>

        <label for="clima">Clima Attuale:</label>
        <select id="clima" name="clima" required>
            <option value="pioggia">Pioggia</option>
            <option value="sereno">Sereno</option>
            <option value="ventoso">Ventoso</option>
            <option value="umido">Umido</option>
            <option value="foschia">Foschia</option>
        </select><br><br>

        <label for="altitudine">Altitudine:</label>
        <input type="number" id="altitudine" name="altitudine"><br><br>

        <input type="submit" value="Invia Rilevazione">
    </form>
</body>
</html>
